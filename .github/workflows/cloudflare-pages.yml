name: Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_PAGES_PROJECT_NAME: songbrief
  CLOUDFLARE_PAGES_DIRECTORY: docs

jobs:
  deploy:
    name: Deploy SongBrief site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Verify static site files
        shell: bash
        run: |
          test -f "$CLOUDFLARE_PAGES_DIRECTORY/index.html"
          test -f "$CLOUDFLARE_PAGES_DIRECTORY/privacy/index.html"
          test -f "$CLOUDFLARE_PAGES_DIRECTORY/terms/index.html"
          test -f "$CLOUDFLARE_PAGES_DIRECTORY/app-ads.txt"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ env.CLOUDFLARE_PAGES_DIRECTORY }} --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
