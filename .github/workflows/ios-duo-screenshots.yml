name: iPhone Duo Screenshots

on:
  workflow_dispatch:
    inputs:
      launch_wait_seconds:
        description: "Seconds to wait after launching the app before each screenshot."
        required: false
        default: "15"
        type: string
      languages:
        description: "Space-separated app languages to capture (japanese english chineseSimplified korean)."
        required: false
        default: "japanese english"
        type: string

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.8"
  BUNDLE_ID: "app.songbrief.songbrief"
  XCODE_PATH: "/Applications/Xcode_27.1.app"
  MIN_IOS_SDK_VERSION: "27.1"

jobs:
  duo-screenshots:
    name: Capture iPhone Duo simulator screenshots
    # Xcode 27 image (macOS 27, arm64) ships Xcode 27.1 and the iPhone Duo device type.
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Select Xcode and verify iOS SDK
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_PATH" ]; then
            echo "$XCODE_PATH not found on this runner. Installed Xcode versions:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XCODE_PATH/Contents/Developer"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK version: $SDK_VERSION"
          if [ "$(printf '%s %s' "$MIN_IOS_SDK_VERSION" "$SDK_VERSION" | tr ' ' '\n' | sort -V | head -n 1)" != "$MIN_IOS_SDK_VERSION" ]; then
            echo "::error::iPhoneOS SDK $SDK_VERSION is older than required $MIN_IOS_SDK_VERSION. Check runs-on and XCODE_PATH."
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate app icon and splash assets
        run: |
          set -euo pipefail
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          (cd ios && pod install)

      - name: Build simulator app
        # Ads and Crashlytics stay off; with no Music library the app shows demo data.
        run: |
          set -euo pipefail
          flutter build ios --simulator --debug \
            --dart-define=SONGBRIEF_AD_MODE=off \
            --dart-define=SONGBRIEF_FIREBASE_CRASHLYTICS_ENABLED=false             --dart-define=SONGBRIEF_SCREENSHOT_MODE=true
          test -d build/ios/iphonesimulator/Runner.app

      - name: Find and boot iPhone Duo simulator
        run: |
          set -euo pipefail
          DUO_ID="$(
            xcrun simctl list devices available --json |
              /usr/bin/python3 -c '
          import json
          import sys

          data = json.load(sys.stdin).get("devices", {})
          for runtime in sorted(data, reverse=True):
              for device in data[runtime]:
                  if device.get("isAvailable", True) and "Duo" in device.get("name", ""):
                      print(device["udid"])
                      raise SystemExit
          '
          )"
          if [ -z "$DUO_ID" ]; then
            # Fall back to creating one from a matching device type + iOS runtime.
            DUO_TYPE="$(xcrun simctl list devicetypes | grep -i 'Duo' | head -n 1 | sed -E 's/.*\((com\.apple[^)]*)\)$/\1/')"
            RUNTIME="$(xcrun simctl list runtimes available | grep -E 'iOS 27\.1' | head -n 1 | sed -E 's/.* - (com\.apple[^ ]*)$/\1/')"
            if [ -z "$DUO_TYPE" ] || [ -z "$RUNTIME" ]; then
              echo "::error::No iPhone Duo simulator or device type found. Available device types and runtimes:"
              xcrun simctl list devicetypes
              xcrun simctl list runtimes
              exit 1
            fi
            DUO_ID="$(xcrun simctl create "SongBrief Duo" "$DUO_TYPE" "$RUNTIME")"
          fi
          echo "DUO_ID=$DUO_ID" >> "$GITHUB_ENV"
          echo "Using iPhone Duo simulator: $DUO_ID"
          xcrun simctl bootstatus "$DUO_ID" -b

      # simctl cannot fold or unfold the Duo, so use duo-hinge (MIT, tosbaha/duo-fold-control),
      # which sends the same hinge event as Device Hub through private CoreSimulator SPI.
      - name: Build duo-hinge
        env:
          DUO_HINGE_SHA: "6207cc897648959c3c2213ac3a2dcf38f6f9eb41"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/duo-hinge"
          curl -fsSL "https://raw.githubusercontent.com/tosbaha/duo-fold-control/$DUO_HINGE_SHA/tools/duo-hinge.m" \
            -o "$RUNNER_TEMP/duo-hinge/duo-hinge.m"
          clang -fobjc-arc -framework Foundation -o "$RUNNER_TEMP/duo-hinge/duo-hinge" "$RUNNER_TEMP/duo-hinge/duo-hinge.m"
          echo "DUO_HINGE=$RUNNER_TEMP/duo-hinge/duo-hinge" >> "$GITHUB_ENV"

      - name: Install and launch app, capture screenshots
        env:
          LANGUAGES: ${{ inputs.languages }}
        run: |
          set -euo pipefail
          WAIT="${{ inputs.launch_wait_seconds }}"
          OUT="$RUNNER_TEMP/duo-screenshots"
          mkdir -p "$OUT"
          xcrun simctl install "$DUO_ID" build/ios/iphonesimulator/Runner.app
          xcrun simctl status_bar "$DUO_ID" override --time "9:41" --batteryState charged --batteryLevel 100 \
            --wifiBars 3 --cellularMode active --cellularBars 4 || echo "::warning::Status bar override failed."

          # The Duo exposes one display per panel and simctl refuses to pick one, listing the
          # choices as "--display=N  NAME (ROLE) WxH". Outer is 1398 px wide, inner 2007 px.
          xcrun simctl io "$DUO_ID" enumerate > "$OUT/display-enumerate.txt" 2>&1 || true
          xcrun simctl io "$DUO_ID" screenshot "$OUT/unused.png" > "$OUT/display-choices.txt" 2>&1 || true
          rm -f "$OUT/unused.png"
          cat "$OUT/display-choices.txt"
          display_for_width() {
            grep -E -- "--display=[0-9]+ .* $1x[0-9]+" "$OUT/display-choices.txt" \
              | grep -oE -- '--display=[0-9]+' | head -n 1 | cut -d= -f2 || true
          }
          OUTER_DISPLAY="$(display_for_width 1398)"
          INNER_DISPLAY="$(display_for_width 2007)"
          echo "Outer display: ${OUTER_DISPLAY:-unknown}, inner display: ${INNER_DISPLAY:-unknown}"

          capture() {
            local display="$1" path="$2"
            if [ -z "$display" ]; then
              echo "::warning::Display for $path was not found."
              return 0
            fi
            mkdir -p "$(dirname "$path")"
            xcrun simctl io "$DUO_ID" screenshot --display="$display" "$path" \
              || echo "::warning::Screenshot $path failed."
          }
          set_hinge() {
            "$DUO_HINGE" -d "$DUO_ID" "$1" || echo "::warning::duo-hinge $1 failed."
            sleep 5
          }
          # shared_preferences stores keys in NSUserDefaults with a "flutter." prefix. The app is
          # sandboxed, so write its container plist (by path, through the simulator's cfprefsd).
          PREFS="$(xcrun simctl get_app_container "$DUO_ID" "$BUNDLE_ID" data)/Library/Preferences/$BUNDLE_ID"
          write_pref() {
            xcrun simctl spawn "$DUO_ID" defaults write "$PREFS" "flutter.$1" "$2" "$3"
          }
          launch_section() {
            xcrun simctl terminate "$DUO_ID" "$BUNDLE_ID" >/dev/null 2>&1 || true
            write_pref songbrief_screenshot_section -string "$1"
            xcrun simctl spawn "$DUO_ID" defaults read "$PREFS" | grep songbrief_ || true
            xcrun simctl launch "$DUO_ID" "$BUNDLE_ID" >/dev/null
            sleep "$WAIT"
          }

          write_pref songbrief_temporary_demo_library_enabled_v1 -bool YES
          SECTIONS="playing overview rankings library settings"
          for LANGUAGE in $LANGUAGES; do
            write_pref songbrief_app_language_v1 -string "$LANGUAGE"
            set_hinge closed
            INDEX=1
            for SECTION in $SECTIONS; do
              launch_section "$SECTION"
              capture "$OUTER_DISPLAY" "$OUT/$LANGUAGE/outer/$INDEX-$SECTION.png"
              INDEX=$((INDEX + 1))
            done
            set_hinge flat
            INDEX=1
            for SECTION in $SECTIONS; do
              launch_section "$SECTION"
              capture "$INNER_DISPLAY" "$OUT/$LANGUAGE/inner/$INDEX-$SECTION.png"
              INDEX=$((INDEX + 1))
            done
          done
          find "$OUT" -type f | sort

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: songbrief-duo-screenshots-${{ github.run_number }}
          path: ${{ runner.temp }}/duo-screenshots/
          if-no-files-found: error
